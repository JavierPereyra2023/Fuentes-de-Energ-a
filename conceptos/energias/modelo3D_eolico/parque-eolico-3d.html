<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bundled Page</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" sc-camel-view-box="0 0 200 200"><rect width="200" height="200" fill="#16324a"></rect><circle cx="100" cy="80" r="9" fill="#e8b46a"></circle><g stroke="#f4f1ea" stroke-width="7" stroke-linecap="round"><path d="M100 80 L100 34"></path><path d="M100 80 L140 103"></path><path d="M100 80 L60 103"></path></g><rect x="95" y="80" width="10" height="76" fill="#f4f1ea"></rect></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');
    template = template.replace('Parque Eólico Valle Norte', 'Parque Eólico Los Teros');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    const responsiveMeta = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">';
    const responsiveStyles = `<style id="natura-responsive">
      * { box-sizing: border-box; }
      button, input { touch-action: manipulation; }
      #natura-model-nav {
        position: fixed; z-index: 100000; top: 118px; left: 50%; transform: translateX(-50%);
        display: none; align-items: center; gap: 7px; font-family: Arial, sans-serif;
      }
      .natura-model-standalone #natura-model-nav { display: flex; }
      .natura-model-nav-button {
        display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 8px 12px;
        border: 1px solid rgba(244,241,234,.22); border-radius: 5px;
        background: rgba(13,17,22,.82); color: #f4f1ea; backdrop-filter: blur(12px);
        font: 700 10px/1.2 Arial, sans-serif; letter-spacing: .06em; text-transform: uppercase;
        text-decoration: none; white-space: nowrap; cursor: pointer;
      }
      .natura-model-nav-button:hover { border-color: rgba(232,180,106,.75); background: rgba(37,31,25,.92); }
      .natura-model-compact [data-dc-tpl="19"],
      .natura-model-compact [data-dc-tpl="54"] { display: none !important; }
      @media (max-width: 700px) {
        .natura-model-standalone [data-dc-tpl="19"],
        .natura-model-standalone [data-dc-tpl="54"] { display: none !important; }
        #natura-model-nav { top: 118px; width: calc(100% - 20px); }
        .natura-model-nav-button { flex: 1; padding: 7px 8px; font-size: 8.5px; white-space: normal; text-align: center; }
        [data-dc-tpl="7"] { padding: 10px !important; gap: 8px !important; }
        [data-dc-tpl="8"] { width: 42% !important; max-width: 155px !important; padding: 9px 10px 10px !important; gap: 3px !important; }
        [data-dc-tpl="9"] { font-size: 8px !important; line-height: 1.25 !important; letter-spacing: .16em !important; }
        [data-dc-tpl="10"] { font-size: 18px !important; line-height: 1.08 !important; }
        [data-dc-tpl="11"] { width: 55% !important; gap: 5px !important; }
        [data-dc-tpl="12"] { display: none !important; }
        [data-dc-tpl="13"] { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)) !important; width: 100% !important; gap: 4px !important; }
        [data-dc-tpl="14"], [data-dc-tpl="15"], [data-dc-tpl="16"], [data-dc-tpl="17"] {
          min-height: 38px !important; padding: 6px 5px !important; font-size: 9px !important;
          line-height: 1.12 !important; letter-spacing: .01em !important;
        }
        [data-dc-tpl="18"] { font-size: 8px !important; line-height: 1.25 !important; padding: 4px 6px !important; text-align: right !important; }
        [data-dc-tpl="19"] {
          left: 10px !important; right: 10px !important; bottom: 68px !important; width: auto !important;
          padding: 11px 12px !important; gap: 8px !important;
        }
        [data-dc-tpl="20"], [data-dc-tpl="31"] { gap: 6px !important; }
        [data-dc-tpl="22"], [data-dc-tpl="33"], [data-dc-tpl="41"] { font-size: 8.5px !important; letter-spacing: .14em !important; }
        [data-dc-tpl="23"], [data-dc-tpl="34"] { font-size: 11px !important; }
        [data-dc-tpl="24"], [data-dc-tpl="36"] { min-height: 22px !important; }
        [data-dc-tpl="25"] { font-size: 9px !important; }
        [data-dc-tpl="30"], [data-dc-tpl="38"] { display: none !important; }
        [data-dc-tpl="39"] { gap: 10px !important; }
        [data-dc-tpl="43"] { font-size: 27px !important; }
        [data-dc-tpl="45"] { height: 38px !important; }
        [data-dc-tpl="46"] { gap: 7px !important; }
        [data-dc-tpl="47"], [data-dc-tpl="51"] { padding: 6px 7px !important; }
        [data-dc-tpl="48"], [data-dc-tpl="52"] { font-size: 8px !important; letter-spacing: .1em !important; }
        [data-dc-tpl="49"] { font-size: 12px !important; }
        [data-dc-tpl="53"] { font-size: 10px !important; }
        [data-dc-tpl="54"] {
          left: 10px !important; right: 10px !important; bottom: 8px !important; align-items: stretch !important;
          gap: 3px !important; padding: 7px 9px !important; font-size: 8px !important; line-height: 1.25 !important;
          letter-spacing: .02em !important; text-align: center !important;
        }
      }
      @media (max-width: 700px) and (max-height: 620px) {
        [data-dc-tpl="8"], [data-dc-tpl="18"], [data-dc-tpl="54"] { display: none !important; }
        [data-dc-tpl="11"] { width: 100% !important; margin-left: auto !important; }
        [data-dc-tpl="13"] { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
        [data-dc-tpl="19"] { right: auto !important; bottom: 10px !important; width: min(310px, calc(100% - 20px)) !important; }
      }
    </style>`;
    const standaloneControls = `<div id="natura-model-nav" aria-label="Navegación del modelo 3D">
      <a class="natura-model-nav-button" href="../eolica.html#sec05">← Volver a Energía Eólica</a>
      <button class="natura-model-nav-button" id="natura-model-fullscreen" type="button" onclick="if(document.fullscreenElement){document.exitFullscreen();this.textContent='Pantalla completa';}else{document.documentElement.requestFullscreen();this.textContent='Salir de pantalla completa';}">Pantalla completa</button>
    </div>`;
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + responsiveMeta + responsiveStyles + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    doc.body.insertAdjacentHTML('beforeend', standaloneControls);
    if (window.self === window.top) doc.documentElement.classList.add('natura-model-standalone');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

pm.dispose();\n    } catch (e) { console.warn('[eolico] env map skipped', e); }\n\n    // ---------- light ----------\n    const sun = new T.DirectionalLight(0xfff0d6, 1.85);\n    sun.position.copy(sunDir).multiplyScalar(280);\n    sun.castShadow = true;\n    this.sun = sun;\n    sun.shadow.mapSize.set(2048, 2048);\n    const sc = sun.shadow.camera;\n    sc.left = -190; sc.right = 190; sc.top = 170; sc.bottom = -170; sc.near = 30; sc.far = 620;\n    sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.6;\n    scene.add(sun);\n    const hemi = new T.HemisphereLight(0xa8c6e8, 0x4a4a38, 0.65); scene.add(hemi); this.hemi = hemi;\n    const moon = new T.DirectionalLight(0x9db4dd, 0); moon.position.set(-140, 180, -60); scene.add(moon); this.moon = moon;\n    const bounce = new T.DirectionalLight(0xbcd4ea, 0.28); bounce.position.set(90, 40, -120); scene.add(bounce); this.bounce = bounce;\n    const villageLamp = new T.PointLight(0xffb968, 0, 90, 2); villageLamp.position.set(142, 16, 22); scene.add(villageLamp);\n    this.villageLamp = villageLamp;\n\n    // ---------- terrain ----------\n    const geo = new T.PlaneGeometry(680, 460, 260, 176);\n    const pos = geo.attributes.position, col = [];\n    const cLow = new T.Color(0x546b3a), cMid = new T.Color(0x6d874c), cHi = new T.Color(0x8d8a72), cDry = new T.Color(0x7d8a55);\n    const tmp = new T.Color();\n    for (let i = 0; i < pos.count; i++) {\n      const x = pos.getX(i), z = -pos.getY(i);\n      const h = this.H(x, z);\n      pos.setZ(i, h);\n      const t = Math.min(1, Math.max(0, (h - 1) / 12));\n      tmp.copy(cLow).lerp(cMid, Math.min(1, t * 1.6)).lerp(cHi, Math.max(0, (t - 0.62) * 2.2));\n      tmp.lerp(cDry, 0.18 * (0.5 + 0.5 * Math.sin(x * 0.07 + z * 0.05)));\n      tmp.convertSRGBToLinear();\n      col.push(tmp.r, tmp.g, tmp.b);\n    }\n    geo.setAttribute('color', new T.Float32BufferAttribute(col, 3));\n    geo.computeVertexNormals();\n    const ground = new T.Mesh(geo, new T.MeshStandardMaterial({ vertexColo ---------\n    const mkSub = (x, z, big) => {\n      const gy = this.H(x, z), grp = new T.Group(); grp.position.set(x, gy, z);\n      const pad = new T.Mesh(new T.BoxGeometry(big ? 22 : 17, 0.7, big ? 17 : 13), matConcrete);\n      pad.position.y = 0.35; pad.receiveShadow = true; grp.add(pad);\n      const body = new T.Mesh(new T.BoxGeometry(big ? 8 : 6, big ? 6.4 : 5, big ? 6 : 4.6), matPanel);\n      body.position.set(-2.5, (big ? 3.2 : 2.5) + 0.7, 0); body.castShadow = true; body.receiveShadow = true; grp.add(body);\n      for (let i = 0; i < 3; i++) {\n        const coil = new T.Mesh(new T.CylinderGeometry(0.75, 0.75, big ? 5 : 3.8, 14), new T.MeshStandardMaterial({ color: 0xd9d4c8, roughness: 0.6, metalness: 0.2 }));\n        coil.position.set(3.2, (big ? 3.2 : 2.6) + 0.7, -3 + i * 3); coil.castShadow = true; grp.add(coil);\n        const cap = new T.Mesh(new T.CylinderGeometry(0.28, 0.28, 1.4, 10), matSteelDark);\n        cap.position.set(3.2, (big ? 6.2 : 5.1) + 0.7, -3 + i * 3); grp.add(cap);\n      }\n      const gantry = new T.Group();\n      for (const gx of [-7, 7]) {\n        const p = new T.Mesh(new T.BoxGeometry(0.5, 13, 0.5), matSteelDark); p.position.set(gx, 7, big ? -6 : -4.6); p.castShadow = true; gantry.add(p);\n      }\n      const beam = new T.Mesh(new T.BoxGeometry(14.5, 0.5, 0.5), matSteelDark); beam.position.set(0, 13.3, big ? -6 : -4.6); gantry.add(beam);\n      grp.add(gantry);\n      const fence = new T.Mesh(new T.BoxGeometry(big ? 22 : 17, 2.4, big ? 17 : 13), new T.MeshStandardMaterial({ color: 0x8f9498, roughness: 0.7, metalness: 0.4, wireframe: true, transparent: true, opacity: 0.35 }));\n      fence.position.y = 1.9; grp.add(fence);\n      scene.add(grp);\n      // gz = the gantry plane, where the line's conductors land\n      return { x, z, y: gy, top: gy + 13.3, gz: z + (big ? -6 : -4.6) };\n    };\n    const subUp = mkSub(22, -42, true);\n    const subDn = mkSub(112, -12, false);\n\n    // ---------- transmission pylons ----------\n    // Proper lattice towers: tapered body, X-braced faces, three crossarms with\n    // hanging insulator strings and an earth-wire peak. Every strut of every\n    // tower is collected into two InstancedMeshes, so the whole line costs two\n    // draw calls instead of the several hundred separate meshes it looks like.\n    const legStruts = [], braceStruts = [], insulatorTips = [];\n    const addStrut = (arr, a, b) => arr.push([a, b]);\n\n    // dirX/dirZ = which way the line runs, so the arms sit across it\n    const mkPylon = (x, z, dirX, dirZ) => {\n      const gy = this.H(x, z), TH = 30, waist = 18;\n      const dl = Math.hypot(dirX, dirZ) || 1;\n      const yaw = Math.atan2(-dirX / dl, -dirZ / dl);\n      const c = Math.cos(yaw), s = Math.sin(yaw);\n      const P = (lx, ly, lz) => new T.Vector3(x + lx * c + lz * s, gy + ly, z - lx * s + lz * c);\n      const hw = (y) => (y < waist ? 4.0 - 2.9 * (y / waist) : 1.1);\n      const corner = (y, i) => P(((i === 0 || i === 3) ? -1 : 1) * hw(y), y, ((i === 0 || i === 1) ? -1 : 1) * hw(y));\n\n      const lv = [0, 3.4, 6.6, 9.5, 12.1, 14.4, waist, 20.6, 23.6, 26.6, TH];\n      for (let k = 0; k < lv.length - 1; k++) {\n        for (let i = 0; i < 4; i++) {\n          const j = (i + 1) % 4;\n          addStrut(legStruts, corner(lv[k], i), corner(lv[k + 1], i));       // leg\n          addStrut(braceStruts, corner(lv[k + 1], i), corner(lv[k + 1], j)); // belt\n          addStrut(braceStruts, corner(lv[k], i), corner(lv[k + 1], j));     // X brace\n          addStrut(braceStruts, corner(lv[k], j), corner(lv[k + 1], i));\n        }\n      }\n      for (let i = 0; i < 4; i++) addStrut(braceStruts, corner(0, i), corner(0, (i + 1) % 4));\n\n      // three crossarms, each tied back into the body above and below\n      const tips = [];\n      for (const arm of [[20.2, 8.4], [23.8, 6.9], [27.4, 5.4]]) {\n        const ay = arm[0], half = arm[1];\n        addStrut(braceStruts, P(-half, ay, 0), P(half, ay, 0));\n        for (const sx of [-1, 1]) {\n          const tip = P(sx * half, ay, 0);\n          addStrut(braceStruts, tip, P(sx * 1.1, ay + 2.5, 0));\n          addStrut(braceStruts, tip, P(sx * 1.1, ay - 1.9, 0));\n          addStrut(braceStruts, P(sx * half * 0.55, ay, 0), P(sx * 1.1, ay + 2.5, 0));\n          insulatorTips.push(tip);\n          tips.push(new T.Vector3(tip.x, tip.y - 2.6, tip.z));   // conductor hangs below the string\n        }\n      }\n      // earth-wire peak\n      const peak = P(0, TH + 2.8, 0);\n      for (let i = 0; i < 4; i++) addStrut(legStruts, corner(TH, i), peak);\n      return { x, z, y: gy, tips, peak };\n    };\n\n    const pylons = [mkPylon(44, -35, 90, 30), mkPylon(68, -27, 90, 30), mkPylon(92, -19, 90, 30)];\n\n    // bake the collected struts into instanced cylinders\n    const bakeStruts = (list, r) => {\n      if (!list.length) return;\n      const im = new T.InstancedMesh(new T.CylinderGeometry(1, 1, 1, 5), matSteelDark, list.length);\n      im.castShadow = true; im.receiveShadow = true;\n      const M2 = new T.Matrix4(), Q2 = new T.Quaternion(), P2 = new T.Vector3(), S2 = new T.Vector3(), D2 = new T.Vector3();\n      const UP = new T.Vector3(0, 1, 0);\n      list.forEach((seg, i) => {\n        D2.subVectors(seg[1], seg[0]);\n        const len = D2.length() || 0.001;\n        P2.copy(seg[0]).addScaledVector(D2, 0.5);\n        Q2.setFromUnitVectors(UP, D2.divideScalar(len));\n        S2.set(r, len, r);\n        im.setMatrixAt(i, M2.compose(P2, Q2, S2));\n      });\n      im.instanceMatrix.needsUpdate = true;\n      scene.add(im);\n    };\n    bakeStruts(legStruts, 0.26);\n    bakeStruts(braceStruts, 0.115);\n\n    // insulator strings: five discs stacked under each arm tip\n    {\n      const matIns = new T.MeshStandardMaterial({ color: 0x93a5b0, roughness: 0.3, metalness: 0.05 });\n      const im = new T.InstancedMesh(new T.CylinderGeometry(0.34, 0.34, 0.16, 8), matIns, insulatorTips.length * 5);\n      const M2 = new T.Matrix4(), Q2 = new T.Quaternion(), P2 = new T.Vector3(), S2 = new T.Vector3(1, 1, 1);\n      let k = 0;\n      for (const tip of insulatorTips) {\n        for (let d = 0; d < 5; d++) {\n          P2.set(tip.x, tip.y - 0.45 - d * 0.52, tip.z);\n          im.setMatrixAt(k++, M2.compose(P2, Q2, S2));\n        }\n      }\n      im.instanceMatrix.needsUpdate = true;\n      im.castShadow = true;\n      scene.add(im);\n    }\n\n    // ---------- village ----------\n    this.windows = [];\n    const matWall = [0xe6e0d4, 0xdcd3c3, 0xcfc6b6, 0xe2d6bd, 0xd6cfc4].map(c => new T.MeshStandardMaterial({ color: c, roughness: 0.88, metalness: 0.01 }));\n    const matRoof = [0x8a4a38, 0x6d5a4d, 0x59626b, 0x7a4c40, 0x5c4a3e].map(c => new T.MeshStandardMaterial({ color: c, roughness: 0.78, metalness: 0.03, flatShading: true, side: T.DoubleSide }));\n    const matStone = new T.MeshStandardMaterial({ color: 0x9c948a, roughness: 0.96, metalness: 0.02 });\n    const matWood = new T.MeshStandardMaterial({ color: 0x5b4430, roughness: 0.9, metalness: 0.02 });\n    const matTrim = new T.MeshStandardMaterial({ color: 0x3f3a33, roughness: 0.7, metalness: 0.05 });\n    const matHedge = new T.MeshStandardMaterial({ color: 0x3f5c30, roughness: 0.95, flatShading: true });\n\n    // Gabled roof built from explicit triangles: two slopes + two gable ends,\n    // with an eaves overhang. ConeGeometry(…, 4) only ever gives a pyramid.\n    const gableGeo = (w, d, rh, over) => {\n      const W = w / 2 + over, D = d / 2 + over;\n      const p = [\n        -W, 0, -D, W, 0, -D, W, 0, D, -W, 0, D,   // 0..3 eaves\n        -W, rh, 0, W, rh, 0                        // 4,5 ridge\n      ];\n      const idx = [\n        0, 1, 5, 0, 5, 4,   // back slope\n        2, 3, 4, 2, 4, 5,   // front slope\n        0, 4, 3,            // left gable\n        1, 2, 5             // right gable\n      ];\n      const g = new T.BufferGeometry();\n      g.setAttribute('position', new T.Float32BufferAttribute(p, 3));\n      g.setIndex(idx);\n      g.computeVertexNormals();\n      return g;\n    };\n\n    const mkWindowMat = () => {\n      const wm = new T.MeshStandardMaterial({ color: 0x2c2a26, emissive: 0xffb45c, emissiveIntensity: 0, roughness: 0.35, metalness: 0.1 });\n      this.windows.push(wm);\n      return wm;\n    };\n\n    // one glazed opening with its frame and sill, placed on a wall face\n    const addWindow = (grp, wm, x, y, z, ry, ww, wh) => {\n      const frame = new T.Mesh(new T.BoxGeometry(ww + 0.34, wh + 0.34, 0.16), matTrim);\n      frame.position.set(x, y, z); frame.rotation.y = ry; grp.add(frame);\n      const glass = new T.Mesh(new T.BoxGeometry(ww, wh, 0.1), wm);\n      glass.position.set(x + Math.sin(ry) * 0.09, y, z + Math.cos(ry) * 0.09);\n      glass.rotation.y = ry; grp.add(glass);\n      const mull = new T.Mesh(new T.BoxGeometry(0.09, wh, 0.12), matTrim);\n      mull.position.copy(glass.position); mull.rotation.y = ry; grp.add(mull);\n      const sill = new T.Mesh(new T.BoxGeometry(ww + 0.5, 0.13, 0.34), matStone);\n      sill.position.set(x + Math.sin(ry) * 0.1, y - wh / 2 - 0.2, z + Math.cos(ry) * 0.1);\n      sill.rotation.y = ry; grp.add(sill);\n    };\n\n    // where each house's service drop terminates, filled in by mkHouse\n    const houseHooks = [];\n\n    // hx,hz = plot centre; kind picks the silhouette\n    const mkHouse = (hx, hz, i, kind) => {\n      const gy = this.H(hx, hz);\n      const w = kind === 'granero' ? 11 : 6.5 + (i % 3) * 1.3;\n      const d = kind === 'granero' ? 8 : 5.5 + ((i + 1) % 3) * 1.1;\n      const h = kind === 'granero' ? 5.4 : 4.4 + (i % 2) * 1.5;\n      const rh = kind === 'granero' ? 4.2 : 2.6 + (i % 3) * 0.5;\n      const grp = new T.Group();\n      grp.position.set(hx, gy, hz);\n      grp.rotation.y = (i * 0.7) % 1.6 - 0.5;\n\n      // stone plinth so walls don't float on the grass\n      const plinth = new T.Mesh(new T.BoxGeometry(w + 0.5, 0.7, d + 0.5), matStone);\n      plinth.position.y = 0.35; plinth.receiveShadow = true; plinth.castShadow = true; grp.add(plinth);\n\n      const wallMat = kind === 'granero' ? new T.MeshStandardMaterial({ color: 0x8c4a3c, roughness: 0.92 }) : matWall[i % matWall.length];\n      const body = new T.Mesh(new T.BoxGeometry(w, h, d), wallMat);\n      body.position.y = 0.7 + h / 2; body.castShadow = true; body.receiveShadow = true; grp.add(body);\n\n      const roof = new T.Mesh(gableGeo(w, d, rh, 0.55), matRoof[i % matRoof.length]);\n      roof.position.y = 0.7 + h; roof.castShadow = true; roof.receiveShadow = true; grp.add(roof);\n      // ridge cap\n      const cap = new T.Mesh(new T.BoxGeometry(w + 1.2, 0.22, 0.4), matTrim);\n      cap.position.y = 0.7 + h + rh; cap.castShadow = true; grp.add(cap);\n\n      // corner posts read as timber framing at this distance\n      for (const sx of [-1, 1]) for (const sz of [-1, 1]) {\n        const post = new T.Mesh(new T.BoxGeometry(0.28, h, 0.28), matWood);\n        post.position.set(sx * (w / 2 - 0.14), 0.7 + h / 2, sz * (d / 2 - 0.14));\n        grp.add(post);\n      }\n\n      // chimney with a cap\n      if (kind !== 'granero') {\n        const ch = new T.Mesh(new T.BoxGeometry(0.85, 2.6 + rh * 0.5, 0.85), matStone);\n        ch.position.set(w * 0.26, 0.7 + h + rh * 0.55, -d * 0.16);\n        ch.castShadow = true; grp.add(ch);\n        const chCap = new T.Mesh(new T.BoxGeometry(1.15, 0.2, 1.15), matTrim);\n        chCap.position.set(ch.position.x, ch.position.y + (2.6 + rh * 0.5) / 2 + 0.1, ch.position.z);\n        grp.add(chCap);\n      }\n\n      const wm = mkWindowMat();\n      const dw = kind === 'granero' ? 3.4 : 1.25, dh = kind === 'granero' ? 4.2 : 2.3;\n      const door = new T.Mesh(new T.BoxGeometry(dw, dh, 0.16), matWood);\n      door.position.set(-w * 0.2, 0.7 + dh / 2, d / 2 + 0.03); grp.add(door);\n      const dFrame = new T.Mesh(new T.BoxGeometry(dw + 0.3, dh + 0.2, 0.1), matTrim);\n      dFrame.position.set(door.position.x, door.position.y + 0.05, d / 2 + 0.005); grp.add(dFrame);\n      const step = new T.Mesh(new T.BoxGeometry(dw + 0.7, 0.18, 0.8), matStone);\n      step.position.set(door.position.x, 0.72, d / 2 + 0.4); grp.add(step);\n\n      addWindow(grp, wm, w * 0.24, 0.7 + h * 0.58, d / 2 + 0.02, 0, w * 0.2, h * 0.3);\n      addWindow(grp, wm, -w * 0.22, 0.7 + h * 0.58, -d / 2 - 0.02, Math.PI, w * 0.2, h * 0.3);\n      addWindow(grp, wm, w / 2 + 0.02, 0.7 + h * 0.58, 0, Math.PI / 2, d * 0.22, h * 0.3);\n      if (kind !== 'granero') {\n        // gable-end attic light\n        addWindow(grp, wm, -w / 2 - 0.02, 0.7 + h + rh * 0.4, 0, -Math.PI / 2, 0.8, 0.8);\n      }\n\n      // a couple of shrubs against the facade\n      for (const sx of [-1, 1]) {\n        const bush = new T.Mesh(new T.IcosahedronGeometry(0.75 + (i % 3) * 0.14, 0), matHedge);\n        bush.position.set(sx * w * 0.42, 1.0, d / 2 + 0.9);\n        bush.scale.set(1, 0.8, 1); bush.castShadow = true; grp.add(bush);\n      }\n\n      // service mast on the ridge — sitting on the ridge rather than on a wall\n      // means the drop cable lands cleanly whichever side the pole is on\n      const mast = new T.Mesh(new T.CylinderGeometry(0.06, 0.08, 2.1, 5), matTrim);\n      mast.position.set(-w * 0.3, 0.7 + h + rh + 1.05, 0); grp.add(mast);\n      const hookCup = new T.Mesh(new T.SphereGeometry(0.13, 6, 5), matTrim);\n      hookCup.position.set(-w * 0.3, 0.7 + h + rh + 2.05, 0); grp.add(hookCup);\n      // the meter box on the wall below it\n      const meter = new T.Mesh(new T.BoxGeometry(0.42, 0.6, 0.22), matTrim);\n      meter.position.set(-w * 0.3, 0.7 + h * 0.62, d / 2 + 0.08); grp.add(meter);\n\n      scene.add(grp);\n      grp.updateMatrixWorld(true);\n      houseHooks.push(hookCup.getWorldPosition(new T.Vector3()));\n      return grp;\n    };\n\n    const houses = [\n      [128, 8], [138, 4], [150, 2], [160, 8], [112, 40], [130, 18], [142, 14],\n      [154, 18], [166, 12], [124, 32], [136, 34], [148, 30], [160, 34],\n      [130, 48], [144, 48], [156, 46], [170, 28]\n    ];\n    houses.forEach((p, i) => mkHouse(p[0], p[1], i, i === 6 ? 'granero' : 'casa'));\n\n    // village church: nave + bell tower with a spire\n    {\n      // set on the village's east edge, clear of the distribution street\n      const cx = 176, cz = 42, gy = this.H(cx, cz);\n      const ch = new T.Group(); ch.position.set(cx, gy, cz); ch.rotation.y = 0.25;\n      const nave = new T.Mesh(new T.BoxGeometry(8, 6.4, 12), matWall[0]);\n      nave.position.y = 3.2; nave.castShadow = true; nave.receiveShadow = true; ch.add(nave);\n      const naveRoof = new T.Mesh(gableGeo(12, 8, 3.2, 0.5), matRoof[2]);\n      naveRoof.rotation.y = Math.PI / 2; naveRoof.position.y = 6.4; naveRoof.castShadow = true; ch.add(naveRoof);\n      const tower = new T.Mesh(new T.BoxGeometry(4.2, 14, 4.2), matWall[2]);\n      tower.position.set(0, 7, -7.4); tower.castShadow = true; ch.add(tower);\n      const spire = new T.Mesh(new T.ConeGeometry(3.2, 5.4, 4), matRoof[2]);\n      spire.rotation.y = Math.PI / 4; spire.position.set(0, 16.7, -7.4); spire.castShadow = true; ch.add(spire);\n      const cross = new T.Mesh(new T.BoxGeometry(0.16, 1.5, 0.16), matTrim);\n      cross.position.set(0, 20.2, -7.4); ch.add(cross);\n      const crossArm = new T.Mesh(new T.BoxGeometry(0.9, 0.16, 0.16), matTrim);\n      crossArm.position.set(0, 20.5, -7.4); ch.add(crossArm);\n      const belfryMat = mkWindowMat();\n      for (const s of [1, -1]) {\n        const bel = new T.Mesh(new T.BoxGeometry(1.5, 2.2, 0.12), belfryMat);\n        bel.position.set(0, 12, -7.4 + s * 2.16); ch.add(bel);\n      }\n      const rose = new T.Mesh(new T.CircleGeometry(1.1, 12), mkWindowMat());\n      rose.position.set(0, 4.6, 6.02); ch.add(rose);\n      scene.add(ch);\n    }\n\n    // grain silo next to the barn\n    {\n      const sx2 = 108, sz2 = 22, gy = this.H(sx2, sz2);\n      const silo = new T.Group(); silo.position.set(sx2, gy, sz2);\n      const drum = new T.Mesh(new T.CylinderGeometry(2.4, 2.4, 11, 14), new T.MeshStandardMaterial({ color: 0xbfc4c6, roughness: 0.55, metalness: 0.4 }));\n      drum.position.y = 5.5; drum.castShadow = true; silo.add(drum);\n      const dome = new T.Mesh(new T.SphereGeometry(2.4, 14, 7, 0, Math.PI * 2, 0, Math.PI / 2), new T.MeshStandardMaterial({ color: 0x9aa1a5, roughness: 0.5, metalness: 0.5 }));\n      dome.position.y = 11; dome.castShadow = true; silo.add(dome);\n      for (let r = 1; r <= 4; r++) {\n        const band = new T.Mesh(new T.TorusGeometry(2.45, 0.09, 6, 16), matTrim);\n        band.rotation.x = Math.PI / 2; band.position.y = r * 2.1; silo.add(band);\n      }\n      scene.add(silo);\n    }\n\n    // paddock fencing: instanced posts + rails around two plots\n    {\n      const fenceLoops = [\n        { x: 96, z: 44, w: 34, d: 26 },\n        { x: 150, z: 62, w: 40, d: 22 }\n      ];\n      const posts = [], rails = [];\n      for (const f of fenceLoops) {\n        const pts = [];\n        const step = 3.4;\n        for (let x = -f.w / 2; x <= f.w / 2; x += step) { pts.push([f.x + x, f.z - f.d / 2]); pts.push([f.x + x, f.z + f.d / 2]); }\n        for (let z = -f.d / 2; z <= f.d / 2; z += step) { pts.push([f.x - f.w / 2, f.z + z]); pts.push([f.x + f.w / 2, f.z + z]); }\n        for (const [px, pz] of pts) posts.push([px, pz]);\n        // rails: one long box per side, at two heights\n        for (const hy of [0.75, 1.45]) {\n          rails.push({ x: f.x, z: f.z - f.d / 2, y: hy, len: f.w, rot: 0 });\n          rails.push({ x: f.x, z: f.z + f.d / 2, y: hy, len: f.w, rot: 0 });\n          rails.push({ x: f.x - f.w / 2, z: f.z, y: hy, len: f.d, rot: Math.PI / 2 });\n          rails.push({ x: f.x + f.w / 2, z: f.z, y: hy, len: f.d, rot: Math.PI / 2 });\n        }\n      }\n      const postIM = new T.InstancedMesh(new T.BoxGeometry(0.18, 1.8, 0.18), matWood, posts.length);\n      postIM.castShadow = true;\n      const M1 = new T.Matrix4(), Q1 = new T.Quaternion(), E1 = new T.Euler(), P1 = new T.Vector3(), S1 = new T.Vector3(1, 1, 1);\n      posts.forEach((p, i) => {\n        E1.set(0, 0, 0); Q1.setFromEuler(E1);\n        P1.set(p[0], this.H(p[0], p[1]) + 0.9, p[1]);\n        postIM.setMatrixAt(i, M1.compose(P1, Q1, S1));\n      });\n      postIM.instanceMatrix.needsUpdate = true;\n      scene.add(postIM);\n      for (const r of rails) {\n        const rail = new T.Mesh(new T.BoxGeometry(r.len, 0.1, 0.09), matWood);\n        rail.position.set(r.x, this.H(r.x, r.z) + r.y, r.z);\n        rail.rotation.y = r.rot;\n        scene.add(rail);\n      }\n    }\n\n    // ---------- conductors + pulses ----------\n    const V = (x, y, z) => new T.Vector3(x, y, z);\n    const curves = [];       // every cable that gets drawn\n    const pulseCurves = [];  // the subset that also carries an animated pulse\n    const sag = (a, b, k) => {\n      const pts = [];\n      for (let i = 0; i <= 8; i++) {\n        const t = i / 8, p = a.clone().lerp(b, t);\n        p.y -= Math.sin(Math.PI * t) * k;\n        pts.push(p);\n      }\n      return new T.CatmullRomCurve3(pts);\n    };\n    // A six-conductor line needs six cables per span; animating a pulse on all\n    // of them would multiply the line objects for no extra clarity, so only one\n    // conductor per span is energised.\n    const addCable = (a, b, k, animate) => {\n      const c = sag(a, b, k);\n      curves.push(c);\n      if (animate) pulseCurves.push(c);\n    };\n\n    // collector cables: each turbine feeds the step-up substation\n    const gateUp = V(subUp.x, subUp.top, subUp.gz);\n    for (const t of this.turbines) addCable(V(t.x, t.hubY - 3, t.z), gateUp, 5.5, true);\n\n    // high-voltage line: six conductors strung tip to tip, plus an earth wire\n    // along the peaks. Substation ends fan in to the gantry beam.\n    const subPts = (sub) => [-6.2, 6.2, -3.9, 3.9, -1.6, 1.6].map(gx => V(sub.x + gx, sub.top - 1.3, sub.gz));\n    const spans = [subPts(subUp), ...pylons.map(p => p.tips), subPts(subDn)];\n    for (let s = 0; s < spans.length - 1; s++) {\n      for (let ci = 0; ci < 6; ci++) addCable(spans[s][ci], spans[s + 1][ci], 3.0, ci === 0);\n    }\n    const peaks = [V(subUp.x, subUp.top + 0.7, subUp.gz), ...pylons.map(p => p.peak), V(subDn.x, subDn.top + 0.7, subDn.gz)];\n    for (let s = 0; s < peaks.length - 1; s++) addCable(peaks[s], peaks[s + 1], 2.2, false);\n\n    // ---------- low-voltage distribution into the village ----------\n    // Wooden poles carrying three phases down the village street, with a\n    // pole-mounted transformer where the feeder reaches the first houses and a\n    // service drop from the nearest pole to every roof.\n    const matPole = new T.MeshStandardMaterial({ color: 0x6b543c, roughness: 0.93 });\n    const pinTips = [];\n    const mkLvPole = (px, pz, dx, dz, withTx) => {\n      const gy = this.H(px, pz), PH = 9.6;\n      const dl = Math.hypot(dx, dz) || 1;\n      const yaw = Math.atan2(-dx / dl, -dz / dl);\n      const c = Math.cos(yaw), s = Math.sin(yaw);\n      const P = (lx, ly, lz) => new T.Vector3(px + lx * c + lz * s, gy + ly, pz - lx * s + lz * c);\n\n      const mast = new T.Mesh(new T.CylinderGeometry(0.16, 0.24, PH, 7), matPole);\n      mast.position.set(px, gy + PH / 2, pz); mast.castShadow = true; scene.add(mast);\n      const arm = new T.Mesh(new T.BoxGeometry(3.0, 0.17, 0.17), matPole);\n      arm.position.copy(P(0, 8.5, 0)); arm.rotation.y = yaw; arm.castShadow = true; scene.add(arm);\n      for (const sx of [-1, 1]) {\n        const knee = new T.Mesh(new T.BoxGeometry(0.1, 1.5, 0.1), matPole);\n        knee.position.copy(P(sx * 0.5, 7.8, 0));\n        knee.rotation.set(0, yaw, sx * 0.6); scene.add(knee);\n      }\n      const pts = [-1.25, 0, 1.25].map(o => P(o, 8.95, 0));\n      for (const q of pts) pinTips.push(q);\n      if (withTx) {\n        const tx = new T.Mesh(new T.CylinderGeometry(0.62, 0.62, 1.8, 10), matPanel);\n        tx.position.copy(P(0.68, 6.1, 0)); tx.castShadow = true; scene.add(tx);\n        const lid = new T.Mesh(new T.CylinderGeometry(0.7, 0.7, 0.14, 10), matSteelDark);\n e ----------\n    const hide = {\n      wool: new T.MeshStandardMaterial({ color: 0xf0ece2, roughness: 0.95, flatShading: true }),\n      woolDark: new T.MeshStandardMaterial({ color: 0xd8d2c4, roughness: 0.95, flatShading: true }),\n      dark: new T.MeshStandardMaterial({ color: 0x33302c, roughness: 0.9 }),\n      brown: new T.MeshStandardMaterial({ color: 0x8a6a4f, roughness: 0.9 }),\n      chestnut: new T.MeshStandardMaterial({ color: 0x6b4a33, roughness: 0.88 }),\n      bay: new T.MeshStandardMaterial({ color: 0x453227, roughness: 0.88 }),\n      cream: new T.MeshStandardMaterial({ color: 0xc9b391, roughness: 0.9 }),\n      white: new T.MeshStandardMaterial({ color: 0xf4f2ec, roughness: 0.88 }),\n      horn: new T.MeshStandardMaterial({ color: 0xd8cdb4, roughness: 0.6 }),\n      beak: new T.MeshStandardMaterial({ color: 0xc9483a, roughness: 0.6 })\n    };\n\n    // A leg hangs from a pivot group so it can swing about the hip instead of\n    // sliding through the ground.\n    const mkLeg = (parent, x, y, z, len, thick, mat, legs, phase) => {\n      const pivot = new T.Group();\n      pivot.position.set(x, y, z);\n      const m = new T.Mesh(new T.BoxGeometry(thick, len, thick), mat);\n      m.position.y = -len / 2;\n      pivot.add(m);\n      parent.add(pivot);\n      legs.push({ p: pivot, s: phase });\n      return pivot;\n    };\n\n    const builders = {\n      oveja(i, r) {                                   // sheep\n        const g = new T.Group(), legs = [], wool = r() < 0.18 ? hide.woolDark : hide.wool;\n        const body = new T.Mesh(new T.IcosahedronGeometry(1.15, 1), wool);\n        body.position.y = 1.55; body.scale.set(1.35, 0.95, 0.95); body.castShadow = true; g.add(body);\n        const rump = new T.Mesh(new T.IcosahedronGeometry(0.8, 1), wool);\n        rump.position.set(-1.0, 1.5, 0); rump.scale.set(0.9, 0.9, 0.9); g.add(rump);\n        const neck = new T.Group(); neck.position.set(1.05, 1.75, 0); g.add(neck);\n        const head = new T.Mesh(new ratio * 0.34); this.flowT = flowT;\n    const [bp, bt, bn, bb] = this.boltV;\n    for (const p of this.pulses) {\n      const on = ratio > 0.02;\n      p.m.visible = on;\n      if (!on) continue;\n      p.m.material.opacity = 0.45 + ratio * 0.55;\n      const head = (flowT + p.o) % 1, span = 0.035 + ratio * 0.02, arr = p.m.geometry.attributes.position.array;\n      for (let i = 0; i < p.n; i++) {\n        const f = i / (p.n - 1), u = Math.max(0.0005, Math.min(0.9995, head - f * span));\n        p.c.getPointAt(u, bp);\n        p.c.getTangentAt(u, bt);\n        bn.crossVectors(bt, this.boltUp).normalize();\n        bb.crossVectors(bt, bn).normalize();\n        const j = (i === 0 || i === p.n - 1) ? 0 : 0.22 * (0.5 + ratio);\n        const w1 = Math.sin(i * 2.4 + p.ph + t * 26) * j, w2 = Math.cos(i * 3.1 + p.ph * 1.7 + t * 21) * j;\n        arr[i * 3] = bp.x + bn.x * w1 + bb.x * w2;\n        arr[i * 3 + 1] = bp.y + bn.y * w1 + bb.y * w2;\n        arr[i * 3 + 2] = bp.z + bn.z * w1 + bb.z * w2;\n      }\n      p.m.geometry.attributes.position.needsUpdate = true;\n    }\n\n    // village lighting\n    const lampTarget = ratio > 0.05 ? (0.35 + ratio * 1.2) * (0.35 + 1.5 * (1 - this.dayF)) : 0;\n    this.lamp += (lampTarget - this.lamp) * Math.min(1, dt * 1.4);\n    for (const w of this.windows) w.emissiveIntensity = this.lamp;\n    this.villageLamp.intensity = this.lamp * 26;\n\n    // camera\n    if (this.transit) {\n      this.camera.position.lerp(this.goP, Math.min(1, dt * 2.2));\n      this.controls.target.lerp(this.goL, Math.min(1, dt * 2.2));\n      if (this.camera.position.distanceTo(this.goP) < 0.6) this.transit = false;\n    }\n    this.controls.update();\n    this.renderer.render(this.scene, this.camera);\n\n    // readouts (throttled)\n    this._acc = (this._acc || 0) + dt;\n    if (this._acc > 0.22) {\n      this._acc = 0;\n      this.hist.push(this.power); this.hist.shift();\n      this.drawChart();\n      const rpm = (this.omega * 2.4 * 60) / (Math.PI * 2);\n      const hourChanged = Math.abs((this.state.hour ?? -9) - this.hour) > 0.04;\n      if (hourChanged || Math.abs(this.power - this.state.mw) > 0.02 || Math.abs(rpm - this.state.rpm) > 0.05) this.setState({ mw: this.power, rpm, hour: this.hour });\n    }\n  }\n\n  drawChart() {\n    const c = this.chart; if (!c) return;\n    const x = c.getContext('2d'), W = c.width, H2 = c.height;\n    x.clearRect(0, 0, W, H2);\n    const max = 3.2 * (this.turbines ? this.turbines.length : 3);\n    x.strokeStyle = 'rgba(244,241,234,.12)'; x.lineWidth = 1;\n    for (let i = 1; i < 3; i++) { const y = (H2 / 3) * i; x.beginPath(); x.moveTo(0, y); x.lineTo(W, y); x.stroke(); }\n    const n = this.hist.length, step = W / (n - 1);\n    x.beginPath(); x.moveTo(0, H2);\n    this.hist.forEach((v, i) => x.lineTo(i * step, H2 - (v / max) * (H2 - 4) - 2));\n    x.lineTo(W, H2); x.closePath();\n    const g = x.createLinearGradient(0, 0, 0, H2);\n    g.addColorStop(0, 'rgba(232,180,106,.45)'); g.addColorStop(1, 'rgba(232,180,106,0)');\n    x.fillStyle = g; x.fill();\n    x.beginPath();\n    this.hist.forEach((v, i) => { const y = H2 - (v / max) * (H2 - 4) - 2; i ? x.lineTo(i * step, y) : x.moveTo(0, y); });\n    x.strokeStyle = '#e8b46a'; x.lineWidth = 2.4; x.stroke();\n  }\n\n  teardown() {\n    cancelAnimationFrame(this.raf);\n    if (this.ro) this.ro.disconnect();\n    if (this.controls) this.controls.dispose();\n    if (this.scene) this.scene.traverse(o => {\n      if (o.geometry) o.geometry.dispose();\n      if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => m.dispose());\n    });\n    if (this.renderer) { this.renderer.dispose(); if (this.renderer.domElement.parentNode) this.renderer.domElement.parentNode.removeChild(this.renderer.domElement); }\n    this.renderer = null; this.built = false;\n  }\n\n  renderVals() {\n    const i = this.state.windIdx, W = this.WIND[i], cam = this.state.cam;\n    const keys = ['general', 'detalle', 'flujo', 'pueblo'];\n    const on = 'rgba(232,180,106,.22)', off = 'rgba(13,17,22,.55)';\n    const o = {\n      mountRef: el => { if (el && el !== this.mount) { this.mount = el; if (!this.built) this.waitLib(); } },\n      chartRef: el => { if (el && el !== this.chart) { this.chart = el; this.resize(); } },\n      windIdx: i,\n      msText: W.ms.toFixed(0),\n      mwText: this.state.mw.toFixed(2),\n      rpmText: this.state.rpm.toFixed(1),\n      statusText: i === 3 ? 'Aspas en bandera · giro lento de seguridad' : (this.state.mw < 0.05 ? 'Bajo velocidad de arranque' : (i === 2 ? 'Producción nominal' : 'Producción parcial')),\n      statusColor: i === 3 ? '#e8785a' : (this.state.mw < 0.05 ? 'rgba(244,241,234,.6)' : '#8fd6a0'),\n      hourVal: +(this.state.hour ?? this.hour).toFixed(1),\n      clock: (() => { const h = this.state.hour ?? this.hour; const hh = Math.floor(h), mm = Math.floor((h - hh) * 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); })(),\n      phase: (() => { const d = this.dayF, h = this.state.hour ?? this.hour; if (d > 0.75) return 'día'; if (d < 0.12) return 'noche'; return h > 12 ? 'atardecer' : 'amanecer'; })(),\n      skyColor: this.dayF > 0.75 ? '#7fb7d8' : (this.dayF < 0.12 ? '#8b9fc4' : '#e8875a'),\n      autoLabel: this.state.auto === false ? 'Manual' : 'Auto',\n      autoBg: this.state.auto === false ? 'rgba(13,17,22,.55)' : 'rgba(232,180,106,.22)',\n      autoFg: this.state.auto === false ? 'rgba(244,241,234,.72)' : '#ffd7a0',\n      toggleAuto: () => this.setState(s => ({ auto: s.auto === false })),\n      onHour: e => { this.hour = parseFloat(e.target.value); this.setState({ auto: false, hour: this.hour }); },\n      onWind: e => {\n        const n = parseInt(e.target.value, 10);\n        this.targetMs = this.WIND[n].ms;\n        this.setState({ windIdx: n });\n      }\n    };\n    keys.forEach((k, n) => {\n      o['b' + n] = cam === k ? on : off;\n      o['f' + n] = cam === k ? '#ffd7a0' : 'rgba(244,241,234,.78)';\n      o['cam' + n] = () => { this.setState({ cam: k }); this.applyCam(k); };\n      o['w' + n] = i === n ? (n === 3 ? '#e8785a' : '#e8b46a') : 'rgba(244,241,234,.45)';\n    });\n    return o;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
